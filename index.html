<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Registro</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="contenedor">

        <h1>SISTEMA DE REGISTRO</h1>

        <form id="formulario">

            <input type="text"
            id="nombre"
            placeholder="Ingrese nombre"
            required>

            <input type="text"
            id="apellido"
            placeholder="Ingrese apellido"
            required>

            <input type="number"
            id="edad"
            placeholder="Ingrese edad"
            required>

            <input type="email"
            id="correo"
            placeholder="Ingrese correo"
            required>

            <button type="submit">

                Guardar Datos

            </button>

        </form>

        <h2>DATOS REGISTRADOS</h2>

        <table>

            <thead>

                <tr>

                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Edad</th>
                    <th>Correo</th>

                </tr>

            </thead>

            <tbody id="tablaDatos">

            </tbody>

        </table>

    </div>


    <footer>

        <p>
            Diseñado por: Neiser Coronel Ruiz
        </p>

    </footer>


    <script type="module" src="script.js"></script>

</body>

</html>
